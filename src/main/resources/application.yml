spring:
  application:
    name: artisan-marketplace

  datasource:
    url: jdbc:postgresql://localhost:5432/artisan_marketplace
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
